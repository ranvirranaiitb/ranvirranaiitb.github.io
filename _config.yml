# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that.
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: "Ranvir Rana | Researcher, Entrepreneur, and Systems Strategist"
name: "Ranvir Rana"
description: >- # this means to ignore newlines until "baseurl:"
    Ranvir Rana is an expert in decentralized consensus mechanisms, finance, and visual models.
    CEO of Witness Chain, former guest lecturer at Princeton University, and PhD graduate from the University of Illinois at Urbana-Champaign.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://ranvirranaiitb.github.io" # the base hostname & protocol for your site
twitter_username: 0xranvir
github_username: ranvirranaiitb
linkedin_username: ranvir-rana-b3121bbb

# Analytics
analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-2YW9CMF6FD"
    anonymize_ip: false

# Build settings
# theme: minimal-mistakes-jekyll  # commenting out the theme
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "contrast" # "default", "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Custom CSS
extra_css:
  - _sass/_custom.scss

# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-seo-tag

# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/
  notes:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
  # _talks
  - scope:
      path: ""
      type: talks
    values:
      layout: single
      author_profile: true
      share: true
  # _notes
  - scope:
      path: ""
      type: notes
    values:
      layout: single
      author_profile: true
      share: true

# Site Author
author:
  avatar:
    path: "/assets/images/RanvirRana.jpeg"
    alt: "Ranvir Rana - Researcher, Entrepreneur, and Systems Strategist"
  bio              : "Researcher, Entrepreneur, System Strategist"
  location         : "Princeton, NJ"
  email            : 
  links:
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?hl=en&user=0ei9XEUAAAAJ"
    - label: "X"
      icon: "fab fa-fw fa-twitter"
      url: "https://x.com/0xranvir"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/ranvir-rana-b3121bbb/"

# Site Footer
footer:
  links:
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?hl=en&user=0ei9XEUAAAAJ"
    - label: "X"
      icon: "fab fa-fw fa-twitter"
      url: "https://x.com/0xranvir"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/ranvir-rana-b3121bbb/"

# Reading Files
include:
  - .htaccess
  - _pages

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gemfile.lock
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README
  - tmp
  - /docs # ignore Minimal Mistakes /docs
  - /test # ignore Minimal Mistakes /test
